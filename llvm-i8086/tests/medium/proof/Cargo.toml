[package]
name = "medium_proof"
version = "0.1.0"
edition = "2021"
description = "The medium-model proof program (llvm-i8086 spec/abi.md D10): code in several segments"
license = "MIT"
publish = false

[[bin]]
name = "medium_proof"
path = "src/main.rs"
test = false

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
