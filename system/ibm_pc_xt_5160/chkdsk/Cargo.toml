[package]
name = "chkdsk"
version = "0.1.0"
edition = "2021"
description = "CHKDSK.COM of PC DOS 2.00 for the IBM PC XT 5160, reimplemented in Rust"
license = "MIT"
publish = false

[lib]
# Fixed crate name so main.rs and tests stay identical across titles.
name = "software"
path = "src/lib.rs"

[[bin]]
name = "chkdsk"
path = "src/main.rs"
test = false

[target.'cfg(target_os = "none")'.dependencies]
ibm_pc_dos = { path = "../../ibm_pc/platform/dos" }

[dev-dependencies]
# The Rust emulator the four-way test runs PC DOS 2.00 on, and the disk tool.
system_emulator = { package = "ibm_pc-emulator", path = "../../ibm_pc/emulator" }
pcdisk = { path = "../../ibm_pc/platform/tools/pcdisk" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
