[package]
name = "firmware"
version = "0.1.0"
edition = "2021"
description = "firmware for busicom_141pf, reimplemented in Rust"
license = "MIT"
publish = false

[lib]
# Fixed crate name so main.rs and tests stay identical across titles.
name = "software"
path = "src/lib.rs"

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false

[dependencies]

[dev-dependencies]
# Host-only: parse the oracle JSON. Never linked into the target image.
serde_json = "=1.0.140"
[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
