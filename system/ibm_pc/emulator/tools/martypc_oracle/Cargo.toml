[package]
name = "martypc_oracle"
version = "0.1.0"
edition = "2021"
description = "Boots a floppy image on MartyPC's cycle-accurate IBM PC model (validated against real 8088 hardware) and prints the screen: a third, independent oracle for the boot images"
license = "MIT"
publish = false

# MartyPC (external/martypc, MIT) is used as a library, unmodified.
[dependencies]
marty_core = { path = "../../../../../external/martypc/crates/lib/marty_core" }
anyhow = "1"
# the same fluxfox MartyPC uses, to save drive B as a raw image (MARTY_SAVE_B)
fluxfox = { git = "https://github.com/dbalsom/fluxfox.git", branch = "finish_fat", default-features = false, features = ["core", "ibm_pc"] }
marty_common = { path = "../../../../../external/martypc/crates/lib/marty_common" }

# not part of the emulator's workspace: MartyPC pulls in its own dependency tree
[workspace]
