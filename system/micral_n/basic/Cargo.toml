[package]
name = "basic"
version = "0.1.0"
edition = "2021"
description = "basic for micral_n, reimplemented in Rust"
license = "MIT"
publish = false

[lib]
# Fixed crate name so main.rs and tests stay identical across titles.
name = "software"
path = "src/lib.rs"

[[bin]]
name = "basic"
path = "src/main.rs"
test = false

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
# The target build (llvm-i8008/scripts/build_rust.sh) adds -C panic=abort.
# The host unwinds: an error restarts the executive by a caught panic.
